    <title>Button Arena</title>
    <script>
      ;(() => {
        const storageKey = 'button-arena:theme'
        const saved = (() => {
          try {
            return localStorage.getItem(storageKey)
          } catch {
            return null
          }
        })()
        const preference = saved === 'light' || saved === 'dark' || saved === 'system' ? saved : 'system'
        const theme =
          preference === 'light' || preference === 'dark'
            ? preference
            : typeof window.matchMedia === 'function' && window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light'

        document.documentElement.dataset.theme = theme
        document.documentElement.dataset.themePreference = preference
        document.documentElement.style.colorScheme = theme
      })()
    </script>
    <script defer src="https://analytics.digitalnature.io/script.js" data-website-id="e7641652-5fa3-475a-aeda-0529cbf44e26" data-domains="button-arena.biopoietic.com"></script>
